<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bienvenida — FLUX_AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #44113E;
      --bg2: #3A0D35;
      --primary: #FF49C1;
      --primary-glow: #FFB3AE;
      --cream: #FFF7AD;
      --text: #FFFFFF;
      --text-dim: rgba(255,255,255,0.65);
      --border: rgba(255,73,193,0.28);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background:
        radial-gradient(circle at 85% 15%, rgba(255,73,193,0.18), transparent 45%),
        radial-gradient(circle at 10% 90%, rgba(255,179,174,0.12), transparent 40%),
        linear-gradient(160deg, var(--bg2), var(--bg));
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }
    .wrap { width: 100%; max-width: 420px; text-align: center; }

    .logo {
      display: flex; align-items: center; justify-content: center; gap: 0.4rem;
      font-size: 1.15rem; font-weight: 800; letter-spacing: 1px;
      color: var(--text); margin-bottom: 2.75rem;
    }
    .logo .spark { color: var(--primary); }

    .illustration {
      width: 190px; height: 190px; margin: 0 auto 2rem;
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .illustration .glow {
      position: absolute; inset: -20px;
      background: radial-gradient(circle, rgba(255,73,193,0.35), transparent 70%);
      filter: blur(4px);
    }
    .illustration .frame {
      position: relative;
      width: 140px; height: 140px;
      background: linear-gradient(145deg, var(--primary), #a3277f);
      border-radius: 28px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 40px rgba(255,73,193,0.35);
    }
    .illustration svg { width: 52px; height: 52px; }
    .illustration .dot {
      position: absolute;
      color: var(--cream);
      font-size: 1.1rem;
    }
    .illustration .dot.d1 { top: -6px; right: 18px; }
    .illustration .dot.d2 { bottom: 10px; left: -14px; font-size: 0.8rem; }
    .illustration .dot.d3 { top: 30%; right: -18px; font-size: 0.9rem; color: var(--primary-glow); }

    h1 {
      font-size: 2rem;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 0.9rem;
    }
    h1 .accent {
      background: linear-gradient(90deg, var(--primary-glow), var(--primary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 0.95rem;
      max-width: 340px;
      margin: 0 auto 2.25rem;
      line-height: 1.5;
    }

    .actions { display: flex; flex-direction: column; gap: 0.75rem; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 0.4rem;
      padding: 0.95rem; border-radius: 14px; font-size: 1rem; font-weight: 700;
      text-decoration: none; font-family: inherit; cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 6px 20px rgba(255,73,193,0.35); }
    .btn-primary:hover { box-shadow: 0 8px 26px rgba(255,73,193,0.45); }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { background: rgba(255,255,255,0.06); }

    @media (min-width: 560px) {
      .actions { flex-direction: row; justify-content: center; }
      .btn { flex: 0 0 auto; padding: 0.95rem 2rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><span class="spark">✦✦</span> FLUX_AI</div>

    <div class="illustration">
      <div class="glow"></div>
      <div class="frame">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2.5"/>
          <path d="m10 9 5 3-5 3z" fill="#fff" stroke="none"/>
        </svg>
      </div>
      <span class="dot d1">✦</span>
      <span class="dot d2">✦</span>
      <span class="dot d3">✦</span>
    </div>

    <h1>Bienvenida a<br/><span class="accent">FLUX_AI</span></h1>
    <p class="subtitle">Crea, transforma y da vida a tus ideas con el poder de la IA.</p>

    <div class="actions">
      <a href="screens/bienvenida_a_flux_ai/index.html" class="btn btn-primary">Comenzar →</a>
      <a href="screens/registro/index.html" class="btn btn-outline">Crear cuenta</a>
    </div>
  </div>
</body>
</html>
