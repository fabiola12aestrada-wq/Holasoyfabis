<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yopfaby App — FLUX_AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
  <style>
    :root {
      --bg: #131314;
      --surface: #1c1b1c;
      --surface-elevated: #201f20;
      --border: #353436;
      --primary: #bc13fe;
      --primary-glow: #ebb2ff;
      --text: #e5e2e3;
      --text-dim: #d4c0d7;
      --cyan: #00f4fe;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary-glow);
      margin-bottom: 0.5rem;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .logo span { color: var(--primary); }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      color: var(--text-dim);
      margin-bottom: 1.5rem;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      max-height: 70vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* Scrollbar personalizada para el menú */
    nav::-webkit-scrollbar { width: 6px; }
    nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    nav a {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      background: var(--surface-elevated);
      color: var(--text);
      text-decoration: none;
      padding: 0.85rem 1.2rem;
      border-radius: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    nav a .material-icons {
      font-size: 20px;
      color: var(--cyan);
      transition: color 0.2s ease;
    }

    nav a:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(188, 19, 254, 0.3);
    }

    nav a:hover .material-icons {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <span class="material-icons">auto_awesome</span>
      ✦ FLUX<span>_AI</span>
    </div>
    <h1>Yopfaby App</h1>

    <nav>
      <!-- Cambia o renombra la ruta "screens/..." de cada botón según el nombre real de tus carpetas -->
      <a href="screens/inicio/index.html">
        <span class="material-icons">home</span>
        <span>🏠 Inicio</span>
      </a>
      <a href="screens/registro/index.html">
        <span class="material-icons">person_add</span>
        <span>👤 Registro</span>
      </a>
      <a href="screens/generador/index.html">
        <span class="material-icons">palette</span>
        <span>🎨 Generador</span>
      </a>
      <a href="screens/perfil/index.html">
        <span class="material-icons">settings</span>
        <span>⚙️ Perfil</span>
      </a>
      <a href="screens/galeria/index.html">
        <span class="material-icons">photo_library</span>
        <span>🖼️ Galería</span>
      </a>
      <a href="screens/historial/index.html">
        <span class="material-icons">history</span>
        <span>📜 Historial</span>
      </a>
      <a href="screens/favoritos/index.html">
        <span class="material-icons">star</span>
        <span>⭐ Favoritos</span>
      </a>
      <a href="screens/ajustes/index.html">
        <span class="material-icons">tune</span>
        <span>Ajustes</span>
      </a>
      <a href="screens/proyectos/index.html">
        <span class="material-icons">folder</span>
        <span>📁 Proyectos</span>
      </a>
      <a href="screens/herramientas/index.html">
        <span class="material-icons">build</span>
        <span>🛠️ Herramientas</span>
      </a>
      <a href="screens/ayuda/index.html">
        <span class="material-icons">help_outline</span>
        <span>❓ Ayuda</span>
      </a>
    </nav>
  </div>

</body>
</html>
