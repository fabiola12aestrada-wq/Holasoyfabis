<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bienvenida — FLUX_AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #44113E;
      --primary: #FF49C1;
      --primary-glow: #FFB3AE;
      --text: #FFFFFF;
      --text-dim: rgba(255,255,255,0.65);
      --border: rgba(255,73,193,0.28);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 50% 0%, #5c1852 0%, var(--bg) 55%, #34092f 100%);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .container { width: 100%; max-width: 380px; text-align: center; }
    .logo {
      font-size: 1.2rem; font-weight: 800; letter-spacing: 1px;
      color: var(--primary-glow); display: flex; align-items: center;
      justify-content: center; gap: .4rem; margin-bottom: 2.5rem;
    }
    .logo span { color: var(--primary); }
    .hero-art {
      width: 220px; height: 220px; margin: 0 auto 1.5rem; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .hero-art .glow {
      position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,73,193,0.35), transparent 70%);
      filter: blur(6px);
    }
    .hero-art .frame {
      position: relative; width: 130px; height: 130px; border-radius: 28px;
      background: linear-gradient(145deg, rgba(255,73,193,0.25), rgba(255,247,173,0.12));
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 40px rgba(255,73,193,0.25);
    }
    .hero-art .frame svg { width: 46px; height: 46px; }
    .hero-art .spark { position: absolute; color: var(--primary-glow); font-size: 1.1rem; }
    .hero-art .spark.s1 { top: 8%; right: 12%; }
    .hero-art .spark.s2 { bottom: 14%; left: 6%; font-size: .8rem; }
    h1 {
      font-size: 1.7rem; font-weight: 800; line-height: 1.25; margin-bottom: .9rem;
    }
    h1 span { color: var(--primary); }
    p.subtitle {
      color: var(--text-dim); font-size: .95rem; line-height: 1.5; margin-bottom: 2.2rem;
    }
    .actions { display: flex; flex-direction: column; gap: .8rem; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      padding: .95rem; border-radius: 14px; font-family: inherit; font-size: 1rem;
      font-weight: 700; text-decoration: none; cursor: pointer; transition: all .2s ease;
    }
    .btn-primary {
      background: var(--primary); color: #fff; border: none;
      box-shadow: 0 8px 24px rgba(255,73,193,0.35);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(255,73,193,0.45); }
    .btn-outline {
      background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.35);
    }
    .btn-outline:hover { background: rgba(255,255,255,0.08); }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">✦ FLUX<span>_AI</span></div>

    <div class="hero-art">
      <div class="glow"></div>
      <div class="frame">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2.5"/>
          <path d="m10 9 5 3-5 3z" fill="#fff" stroke="none"/>
        </svg>
      </div>
      <span class="spark s1">✦</span>
      <span class="spark s2">✦</span>
    </div>

    <h1>Bienvenida a<br/><span>FLUX_AI</span></h1>
    <p class="subtitle">Crea, transforma y da vida a tus ideas con el poder de la IA.</p>

    <div class="actions">
      <a href="screens/bienvenida_a_flux_ai/index.html" class="btn btn-primary">Comenzar →</a>
      <a href="screens/registro/index.html" class="btn btn-outline">Crear cuenta</a>
    </div>
  </div>
</body>
</html>
