<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aplicación Yopfaby">
  <title>Yopfaby App</title>
  <style>
    body { margin:0; display:flex; height:100vh; font-family:Arial; background:#111; overflow:hidden;}
    #menu { width:200px; background:#111; color:white; padding:10px; display:flex; flex-direction:column; border-right: 1px solid #333;}
    #menu h2 { font-size:18px; margin-bottom:20px; color: #fff; }
    #menu button { width:100%; margin:5px 0; padding:12px; background:#222; color:white; border:none; border-radius:4px; cursor:pointer; text-align:left;}
    #menu button:hover { background:#333; }
    #content { flex:1; display:flex; flex-direction:column; background: white;}
    iframe { width:100%; height:100%; border:none;}
  </style>
</head>
<body>

<div id="menu">
  <h2>🚀 Flux AI</h2>
  <button onclick="load('bienvenido_a_flux_ai_1/code.html')">Inicio</button>
  <button onclick="load('registro_de_usuario_1/code.html')">Registro</button>
  <button onclick="load('dashboard_de_proyectos_1/code.html')">Dashboard</button>
  <button onclick="load('editor_de_storyboard_1/code.html')">Editor</button>
  <button onclick="load('visualizador_de_renderizado_1/code.html')">Render</button>
</div>

<div id="content">
  <iframe id="frame" title="Contenido"></iframe>
</div>

<script>
function load(page){
  document.getElementById("frame").src = page;
}
// Carga la bienvenida por defecto
load('bienvenido_a_flux_ai_1/code.html');
</script>

</body>
</html>
