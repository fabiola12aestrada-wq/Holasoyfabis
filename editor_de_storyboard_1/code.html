<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor de Storyboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: white;
      color: #333;
      overflow: hidden;
    }

    .editor-container {
      display: flex;
      height: 100vh;
      gap: 0;
    }

    .toolbar {
      width: 250px;
      background: #f5f5f5;
      border-right: 1px solid #ddd;
      padding: 20px;
      overflow-y: auto;
    }

    .toolbar h3 {
      color: #00d4ff;
      margin: 20px 0 15px;
      font-size: 14px;
      text-transform: uppercase;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }

    .tool-button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .tool-button:hover {
      border-color: #00d4ff;
      background: #f0f8ff;
      color: #00d4ff;
    }

    .canvas-area {
      flex: 1;
      background: #fafafa;
      border: 2px dashed #ddd;
      margin: 20px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #999;
    }

    .properties-panel {
      width: 250px;
      background: #f5f5f5;
      border-left: 1px solid #ddd;
      padding: 20px;
      overflow-y: auto;
    }

    .property-group {
      margin-bottom: 20px;
    }

    .property-label {
      font-weight: 500;
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="range"],
    input[type="color"],
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
    }

    input[type="color"] {
      height: 40px;
      cursor: pointer;
    }

    .color-palette {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .color-swatch {
      width: 100%;
      height: 30px;
      border-radius: 4px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .color-swatch:hover {
      border-color: #333;
      transform: scale(1.05);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
    }

    .header-buttons button {
      padding: 8px 16px;
      background: #00d4ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }

    .header-buttons button:hover {
      background: #00a8cc;
    }

    @media (max-width: 1024px) {
      .properties-panel {
        display: none;
      }
      .toolbar {
        width: 150px;
      }
    }
  </style>
</head>
<body>

<div class="header">
  <h2>✏️ Editor de Storyboard</h2>
  <div class="header-buttons">
    <button>💾 Guardar</button>
    <button>📤 Exportar</button>
  </div>
</div>

<div class="editor-container">
  <div class="toolbar">
    <h3>Herramientas</h3>
    <button class="tool-button">✏️ Dibujar</button>
    <button class="tool-button">📝 Texto</button>
    <button class="tool-button">🔲 Formas</button>
    <button class="tool-button">🖼️ Imágenes</button>
    <button class="tool-button">🎬 Video</button>
    <button class="tool-button">🎵 Audio</button>

    <h3>Transiciones</h3>
    <button class="tool-button">➡️ Deslizar</button>
    <button class="tool-button">🌀 Desvanecerse</button>
    <button class="tool-button">📊 Zoom</button>
    <button class="tool-button">💫 Explosión</button>

    <h3>Acciones</h3>
    <button class="tool-button">↶ Deshacer</button>
    <button class="tool-button">↷ Rehacer</button>
    <button class="tool-button">🗑️ Limpiar Todo</button>
  </div>

  <div class="canvas-area">
    <div style="text-align: center;">
      <div style="font-size: 48px; margin-bottom: 10px;">🎬</div>
      <div>Arrastra aquí para comenzar a editar</div>
    </div>
  </div>

  <div class="properties-panel">
    <h3>Propiedades</h3>

    <div class="property-group">
      <div class="property-label">Nombre</div>
      <input type="text" placeholder="Mi Storyboard" value="Mi Storyboard">
    </div>

    <div class="property-group">
      <div class="property-label">Duración (segundos)</div>
      <input type="number" value="30" min="1">
    </div>

    <div class="property-group">
      <div class="property-label">FPS</div>
      <select>
        <option value="24">24 FPS</option>
        <option value="30" selected>30 FPS</option>
        <option value="60">60 FPS</option>
      </select>
    </div>

    <div class="property-group">
      <div class="property-label">Color de Fondo</div>
      <input type="color" value="#ffffff">
    </div>

    <div class="property-group">
      <div class="property-label">Paleta Rápida</div>
      <div class="color-palette">
        <div class="color-swatch" style="background: #FF6B6B;"></div>
        <div class="color-swatch" style="background: #4ECDC4;"></div>
        <div class="color-swatch" style="background: #45B7D1;"></div>
        <div class="color-swatch" style="background: #FFA07A;"></div>
        <div class="color-swatch" style="background: #98D8C8;"></div>
        <div class="color-swatch" style="background: #F7DC6F;"></div>
        <div class="color-swatch" style="background: #BB8FCE;"></div>
        <div class="color-swatch" style="background: #85C1E2;"></div>
      </div>
    </div>

    <div class="property-group">
      <div class="property-label">Zoom</div>
      <input type="range" min="25" max="200" value="100">
      <span style="font-size: 12px; color: #666;">100%</span>
    </div>
  </div>
</div>

</body>
</html>
