<script>
(function () {
  const SUPABASE_URL = "https://ddyqisycapjtziiqytji.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_vP5c7xHOl4MwIHRCTkFC0w_DOut5s96";
  let sbClient = null;
  try { sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { console.error("No se pudo inicializar Supabase:", e); }

  // La pantalla de nueva contraseña está en la raíz del proyecto, no dentro de /screens.
  const REDIRECT_URL = "https://fabis-app.vercel.app/nueva-contraseña/";

  const form = document.getElementById("recovery-form");
  const emailInput = document.getElementById("recovery-email");
  const mensaje = document.getElementById("form-mensaje");
  const btn = document.getElementById("submit-btn");
  const btnText = document.getElementById("submit-btn-text");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();
    if (!email) { mensaje.textContent = "Ingresá tu email."; mensaje.className = "error"; return; }
    if (!sbClient) { mensaje.textContent = "No se pudo conectar con el servicio. Intentá más tarde."; mensaje.className = "error"; return; }
    btn.disabled = true; btnText.textContent = "Enviando..."; mensaje.textContent = ""; mensaje.className = "";
    const { error } = await sbClient.auth.resetPasswordForEmail(email, { redirectTo: REDIRECT_URL });
    btn.disabled = false; btnText.textContent = "Send Recovery Link";
    if (error) { mensaje.textContent = "Error: " + error.message; mensaje.className = "error"; return; }
    mensaje.textContent = "Si el email está registrado, te enviamos un link de recuperación."; mensaje.className = "ok"; form.reset();
  });
})();
</script>
