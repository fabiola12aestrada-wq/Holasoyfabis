<!DOCTYPE html>

<html class="dark" lang="en"><head>

                  "on-error": "#690005",

                  "surface": "#44113E",

                  "error": "#ffb4ab",

<style>
    body {
      background-color: #050505;
      color: #e5e2e3;
    }
    .glass-card {
      background: rgba(26, 26, 27, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
    }
    .neon-glow-purple {
      box-shadow: 0 0 15px rgba(255,73,193,0.3);
    }
    .neon-glow-cyan {
      box-shadow: 0 0 15px rgba(255,247,173,0.3);
    }
    .circuit-bg {
      background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.05) 1px, transparent 0);
      background-size: 24px 24px;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-lg circuit-bg min-h-screen flex flex-col items-center justify-center p-gutter">
<!-- Top AppBar (Simulated from JSON Blueprint but detached for recovery focus) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-5 h-16 bg-[#050505]/80 backdrop-blur-xl border-b border-white/10 shadow-[inset_0_1px_0_0_rgba(255,255,255,0.05)]">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#FF49C1]" data-icon="hub">hub</span>
<span class="text-xl font-bold tracking-tighter text-[#FF49C1] drop-shadow-[0_0_8px_rgba(255,73,193,0.6)] font-display-lg">FLUX_AI</span>
</div>
</header>
<main class="w-full max-w-md mt-16 mb-24 flex flex-col gap-stack-lg animate-in fade-in duration-700">
<!-- Hero Header Section -->
<div class="flex flex-col items-center text-center gap-stack-sm">
<h1 class="font-display-lg text-display-lg text-on-background tracking-tighter">Neural Key Recovery</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[280px]">Initialize secure protocol to restore your access</p>
</div>
<!-- Central Graphic Component -->
<div class="relative w-full aspect-square max-w-[280px] mx-auto group">
<div class="absolute inset-0 bg-gradient-to-tr from-primary-container/20 to-secondary-container/20 rounded-full blur-3xl opacity-50 group-hover:opacity-80 transition-opacity"></div>
<div class="glass-card w-full h-full rounded-full flex items-center justify-center relative overflow-hidden border-[#FF49C1]/30">
<div class="absolute inset-0 opacity-20 pointer-events-none" data-alt="Detailed macro shot of a futuristic electronic circuit board with glowing neon cyan and electric purple light traces. The patterns are intricate and geometric, representing a high-speed neural network processor. Deep obsidian surfaces reflect the vibrant light, creating a cinematic cyberpunk aesthetic with soft bokeh in the background." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDNWV3oP6GZKdyloRwd8wfI1XvP90nPOy5Xo5TbsboudtkBu8B_fpMV2A2t9MMyGEHfwdCivi5PbHUGQECtbhAscdTMEH9-87vzlqdmCA__pgYWb7us0E7LT84uRBrnCCcuoIVucG5qvsXG479YbQ5LORG4Lq8Z7bApNwdvtOhjp81d2qMmpnOHOixPSKXg6YINs5D58MCMnrs6-x4shT85cBIFntG2nzglyBZ80niHjGdzFiaIV0qci9Q7tV6GohhkhU_KGqpgDfcI'); background-size: cover;"></div>
<div class="relative z-10 flex flex-col items-center gap-stack-sm">
<span class="material-symbols-outlined text-6xl text-[#FF49C1] drop-shadow-[0_0_15px_rgba(255,73,193,0.8)]" data-icon="fingerprint" style="font-variation-settings: 'FILL' 0;">fingerprint</span>
<div class="h-1 w-24 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full w-2/3 bg-gradient-to-r from-primary-container to-secondary-container animate-pulse"></div>
</div>
</div>
</div>
</div>
<!-- Form Container -->
<div class="glass-card rounded-xl p-stack-lg flex flex-col gap-stack-md">
<!-- Input Field -->
<div class="flex flex-col gap-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1">Neural Identity (Email)</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-secondary-fixed transition-colors" data-icon="shield">shield</span>
</div>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-3 pl-10 pr-4 font-body-lg text-on-surface focus:outline-none focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-all placeholder:text-stone-600" placeholder="identity@neural-net.io" type="email"/>
</div>
</div>
<!-- Info Box -->
<div class="flex gap-stack-sm p-stack-md bg-primary-container/5 border border-primary-container/20 rounded-lg">
<span class="material-symbols-outlined text-primary-container text-sm shrink-0" data-icon="info">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
          A unique, single-use authentication hash will be dispatched to reset your Neural Key. <span class="text-secondary-fixed-dim font-medium">Protocol expires in 15 minutes.</span>
</p>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container hover:bg-primary-container/90 text-on-primary-container font-label-caps py-4 rounded-lg flex items-center justify-center gap-stack-sm transition-transform active:scale-[0.98] neon-glow-purple group">
<span class="material-symbols-outlined group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform" data-icon="rocket_launch">rocket_launch</span>
        Send Recovery Link
      </button>
<!-- Back Link -->
<a class="w-full text-center py-2 text-stone-500 hover:text-[#FFF7AD] font-label-caps flex items-center justify-center gap-stack-sm transition-colors group" href="#">
<span class="material-symbols-outlined text-sm group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
        Back to Login
      </a>
</div>
</main>
<!-- Progress Pulse Footer Overlay -->
<footer class="fixed bottom-0 w-full px-10 pb-8 pointer-events-none">
<div class="max-w-md mx-auto">
<div class="h-[2px] w-full bg-white/5 rounded-full overflow-hidden">
<div class="h-full w-full bg-gradient-to-r from-transparent via-secondary-container to-transparent opacity-30" style="animation: slide 3s linear infinite;"></div>
</div>
</div>
</footer>
<style>
    @keyframes slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }
  </style>
</body></html>
