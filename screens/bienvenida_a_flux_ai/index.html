<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar sesión — FLUX_AI</title>
  <style>
    :root {
      --bg: #44113E;
      --surface-elevated: #6A1452;
      --border: rgba(255,73,193,0.28);
      --primary: #FF49C1;
      --primary-glow: #FFB3AE;
      --text: #FFFFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Nunito', sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem 1rem;
    }
    .container { width: 100%; max-width: 380px; text-align: center; }
    .logo { font-size: 1.6rem; font-weight: 700; color: var(--primary-glow); margin-bottom: 1.5rem; }
    .logo span { color: var(--primary); }
    h1 { font-size: 1.2rem; margin-bottom: 1.5rem; }
    input {
      width: 100%; background: var(--surface-elevated);
      color: var(--text); border: 1px solid var(--border); border-radius: 12px;
      padding: 0.9rem; font-family: inherit; font-size: 0.95rem; margin-bottom: 1rem;
    }
    button {
      width: 100%; background: var(--primary); color: #fff; border: none;
      border-radius: 12px; padding: 0.9rem; font-size: 1rem; font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #mensaje { margin-top: 1rem; font-size: 0.85rem; }
    .link-extra { display: block; margin-top: 1rem; color: var(--text); opacity: 0.7; text-decoration: none; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">✦ FLUX<span>_AI</span></div>
    <h1>Iniciar sesión</h1>

    <input type="email" id="email" placeholder="Correo electrónico" />
    <input type="password" id="password" placeholder="Contraseña" />
    <button id="btnLogin" onclick="iniciarSesion()">Entrar</button>
    <p id="mensaje"></p>

    <a href="../registro/index.html" class="link-extra">¿No tienes cuenta? Regístrate</a>
    <a href="../recuperación/index.html" class="link-extra">¿Olvidaste tu contraseña?</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const mensaje = document.getElementById("mensaje");
    let supaClient;

    try {
      const SUPABASE_URL = "https://ddyqisycapjtziiqytji.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_vP5c7xHOl4MwIHRCTkFC0w_DOut5s96";
      supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (err) {
      mensaje.textContent = "Error al iniciar: " + err.message;
    }

    async function iniciarSesion() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("btnLogin");

      if (!email || !password) {
        mensaje.textContent = "Completa correo y contraseña.";
        return;
      }

      btn.disabled = true;
      mensaje.textContent = "Iniciando sesión...";

      try {
        const { data, error } = await supaClient.auth.signInWithPassword({ email, password });
        btn.disabled = false;

        if (error) {
          mensaje.textContent = "Error: " + error.message;
          return;
        }

        mensaje.textContent = "¡Bienvenida de vuelta!";
        setTimeout(() => {
          window.location.href = "../inicio/index.html";
        }, 800);

      } catch (err) {
        btn.disabled = false;
        mensaje.textContent = "Error inesperado: " + err.message;
      }
    }
  </script>
</body>
</html>
