<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro — FLUX_AI</title>
  <style>
    :root {
      --bg: #131314;
      --surface-elevated: #201f20;
      --border: #353436;
      --primary: #bc13fe;
      --primary-glow: #ebb2ff;
      --text: #e5e2e3;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem 1rem;
    }
    .container { width: 100%; max-width: 380px; text-align: center; }
    .logo { font-size: 1.6rem; font-weight: 700; color: var(--primary-glow); margin-bottom: 1.5rem; }
    .logo span { color: var(--primary); }
    h1 { font-size: 1.2rem; margin-bottom: 1.5rem; }
    input {
      width: 100%; background: var(--surface-elevated);
      color: var(--text); border: 1px solid var(--border); border-radius: 12px;
      padding: 0.9rem; font-family: inherit; font-size: 0.95rem; margin-bottom: 1rem;
    }
    button {
      width: 100%; background: var(--primary); color: #fff; border: none;
      border-radius: 12px; padding: 0.9rem; font-size: 1rem; font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #mensaje { margin-top: 1rem; font-size: 0.85rem; }
    .link-login { display: block; margin-top: 1.5rem; color: var(--text); opacity: 0.7; text-decoration: none; font-size: 0.85rem; }
  </style>
</head>

  <div class="container">
    <div class="logo">✦ FLUX<span>_AI</span></div>
    <h1>Crear cuenta</h1>

    <input type="email" id="email" placeholder="Correo electrónico" />
    <input type="password" id="password" placeholder="Contraseña (mínimo 6 caracteres)" />
    <button id="btnRegistrar" onclick="registrar()">Crear cuenta</button>

    <a href="../bienvenida_a_flux_ai/index.html" class="link-login">¿Ya tienes cuenta? Inicia sesión</a>
  </div>

</html> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const mensaje = document.getElementById("mensaje");

  window.onerror = function(msg, url, line) {
    mensaje.textContent = "Error JS: " + msg + " (línea " + line + ")";
  };

  let supabase;
  try {
    if (!window.supabase) {
      mensaje.textContent = "Error: no cargó la librería de Supabase.";
    } else {
      const SUPABASE_URL = "https://ddyqisycapjtziiqytji.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_vP5c7xHOl4MwIHRCTkFC0w_DOut5s96";
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      mensaje.textContent = "Listo para registrar.";
    }
  } catch (err) {
    mensaje.textContent = "Error al iniciar: " + err.message;
  }

  async function registrar() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("btnRegistrar");

    if (!email || !password) {
      mensaje.textContent = "Completa correo y contraseña.";
      return;
    }
    if (password.length < 6) {
      mensaje.textContent = "La contraseña debe tener al menos 6 caracteres.";
      return;
    }
    if (!supabase) {
      mensaje.textContent = "Error: Supabase no está inicializado.";
      return;
    }

    btn.disabled = true;
    mensaje.textContent = "Creando cuenta...";

    try {
      const { data, error } = await supabase.auth.signUp({ email, password });
      btn.disabled = false;

      if (error) {
        mensaje.textContent = "Error de Supabase: " + error.message;
        return;
      }
      mensaje.textContent = "¡Cuenta creada! Revisa tu correo para confirmar.";
    } catch (err) {
      btn.disabled = false;
      mensaje.textContent = "Error inesperado: " + err.message;
    }
  }
</script>
