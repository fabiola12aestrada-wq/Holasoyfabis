<p class="font-body-lg text-body-lg text-on-surface-variant opacity-80">Initialize your access to the generative neural core.</p>
</div>
<!-- Registration Form Card -->
<div class="glass-card rounded-xl p-stack-lg space-y-stack-md">
<!-- Full Name -->
<div class="space-y-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Full Name</label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-outline-variant focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-all duration-300 rounded-lg px-4 py-3 text-on-surface placeholder:text-stone-600 outline-none" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email Address -->
<div class="space-y-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Email Address</label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-outline-variant focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-all duration-300 rounded-lg px-4 py-3 text-on-surface placeholder:text-stone-600 outline-none" placeholder="neural@link.io" type="email"/>
</div>
</div>
<!-- Neural Key (Password) -->
<div class="space-y-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Neural Key</label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-outline-variant focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-all duration-300 rounded-lg px-4 py-3 text-on-surface placeholder:text-stone-600 outline-none" placeholder="••••••••••••" type="password"/>
</div>
<!-- Entropy Bar -->
<div class="pt-unit flex flex-col gap-1">
<div class="flex justify-between items-center px-1">
<span class="text-[10px] uppercase font-bold tracking-widest text-secondary-fixed-dim">Entropy Strength</span>
<span class="text-[10px] text-secondary-fixed-dim">78%</span>
</div>
<div class="h-1 w-full bg-white/5 rounded-full overflow-hidden">
<div class="h-full w-4/5 pulse-cyan neon-glow-cyan"></div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-stack-md space-y-stack-md">
<button class="w-full py-4 rounded-lg bg-primary-container text-on-primary-container font-headline-md text-headline-md neon-glow-purple active:scale-[0.98] transition-all duration-200">
                    Initialize Account
                </button>
<div class="flex flex-col items-center gap-stack-sm">
<a class="font-label-caps text-label-caps text-secondary-fixed-dim hover:text-secondary-container transition-colors duration-300 uppercase" href="#">Or continue as a guest</a>
</div>
</div>
</div>
<!-- Footer Link -->
<div class="mt-stack-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Already linked to the system? 
                <a class="text-[#FF49C1] font-semibold hover:underline" href="#">Sign In</a>
</p>
