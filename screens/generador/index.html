<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generador — FLUX_AI</title>
  <style>
    :root {
      --bg: #131314;
      --surface-elevated: #201f20;
      --border: #353436;
      --primary: #bc13fe;
      --primary-glow: #ebb2ff;
      --text: #e5e2e3;
      --cyan: #00f4fe;
      --error: #ffb4ab;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 2rem 1rem;
    }
    .container { width: 100%; max-width: 420px; }

    h1 { text-align: center; font-size: 1.3rem; margin-bottom: 0.25rem; }
    .subtitle { text-align: center; opacity: 0.6; font-size: 0.85rem; margin-bottom: 2rem; }

    label {
      font-size: 0.8rem;
      opacity: 0.7;
      display: block;
      margin-bottom: 0.4rem;
    }

    textarea {
      width: 100%;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.75rem;
      resize: none;
      margin-bottom: 1.25rem;
    }
    textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-generar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn-generar:active { transform: scale(0.97); }
    .btn-generar:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .btn-generar.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .resultado {
      margin-top: 1.5rem;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .resultado img {
      width: 100%;
      display: block;
    }
    .resultado .placeholder {
      opacity: 0.4;
      font-size: 0.85rem;
      text-align: center;
      padding: 2rem 1rem;
    }

    #estado {
      text-align: center;
      font-size: 0.85rem;
      margin-top: 1rem;
      min-height: 1.2em;
    }
    #estado.error { color: var(--error); }
    #estado.ok { color: var(--cyan); }

    .btn-volver {
      display: block; text-align: center; margin-top: 2rem; color: var(--text);
      text-decoration: none; font-size: 0.9rem; opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Generador de imágenes</h1>
    <p class="subtitle">Describí lo que querés crear</p>

    <label for="prompt-input">Prompt</label>
    <textarea id="prompt-input" rows="4" placeholder="Ej: un zorro futurista caminando por una ciudad neón bajo la lluvia"></textarea>

    <button id="btn-generar" class="btn-generar">
      <span class="spinner"></span>
      <span id="btn-generar-text">Generar imagen</span>
    </button>

    <div class="resultado" id="resultado">
      <p class="placeholder" id="placeholder-text">Tu imagen generada va a aparecer acá</p>
    </div>

    <p id="estado"></p>

    <a href="../../index.html" class="btn-volver">← Volver al Menú</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ddyqisycapjtziiqytji.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_vP5c7xHOl4MwIHRCTkFC0w_DOut5s96";

    let supabase = null;
    try {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
      console.error("No se pudo inicializar Supabase:", e);
    }

    const promptInput = document.getElementById("prompt-input");
    const btnGenerar = document.getElementById("btn-generar");
    const btnGenerarText = document.getElementById("btn-generar-text");
    const resultado = document.getElementById("resultado");
    const placeholderText = document.getElementById("placeholder-text");
    const estado = document.getElementById("estado");

    async function generarImagen() {
      const prompt = promptInput.value.trim();

      if (!prompt) {
        estado.textContent = "Escribí una descripción antes de generar.";
        estado.className = "error";
        return;
      }

      btnGenerar.disabled = true;
      btnGenerar.classList.add("loading");
      btnGenerarText.textContent = "Generando...";
      estado.textContent = "";
      estado.className = "";
      if (placeholderText) placeholderText.textContent = "Generando tu imagen...";

      try {
        let userId = null;
        if (supabase) {
          const { data } = await supabase.auth.getUser();
          userId = data && data.user ? data.user.id : null;
        }

        const response = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt, user_id: userId }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Ocurrió un error al generar la imagen.");
        }

        resultado.innerHTML = `<img src="${data.image}" alt="${prompt}" />`;
        estado.textContent = "¡Imagen generada con éxito!";
        estado.className = "ok";
      } catch (err) {
        estado.textContent = "Error: " + err.message;
        estado.className = "error";
        resultado.innerHTML = `<p class="placeholder">No se pudo generar la imagen</p>`;
      } finally {
        btnGenerar.disabled = false;
        btnGenerar.classList.remove("loading");
        btnGenerarText.textContent = "Generar imagen";
      }
    }

    btnGenerar.addEventListener("click", generarImagen);
  </script>
</body>
</html>
