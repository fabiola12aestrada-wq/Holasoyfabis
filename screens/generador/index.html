<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FLUX_GEN — Generador de Imágenes IA</title>
  <style>
    :root {
      --bg: #131314;
      --surface-elevated: #201f20;
      --border: #353436;
      --primary: #bc13fe;
      --primary-glow: #ebb2ff;
      --text: #e5e2e3;
      --cyan: #00f4fe;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 2rem 1rem;
    }
    .container { width: 100%; max-width: 420px; text-align: center; }
    .logo { font-size: 1.6rem; font-weight: 700; color: var(--primary-glow); margin-bottom: 1.5rem; }
    .logo span { color: var(--primary); }
    textarea {
      width: 100%; min-height: 100px; background: var(--surface-elevated);
      color: var(--text); border: 1px solid var(--border); border-radius: 12px;
      padding: 1rem; font-family: inherit; font-size: 0.95rem; margin-bottom: 1rem;
    }
    button {
      width: 100%; background: var(--primary); color: #fff; border: none;
      border-radius: 12px; padding: 0.9rem; font-size: 1rem; font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .resultado-container { margin-top: 1.5rem; }
    #loader { color: var(--cyan); }
    img { max-width: 100%; border-radius: 12px; margin-top: 1rem; }
    .btn-volver {
      display: inline-block; margin-top: 1.5rem; color: var(--text);
      text-decoration: none; font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">✦ FLUX<span>_GEN</span></div>
    <h1>Generador de Imágenes IA</h1>

    <textarea id="promptInput" placeholder="Describe la imagen que quieres crear..."></textarea>
    <button id="btnGenerar" onclick="enviarPrompt()">Generar Imagen</button>

    <div class="resultado-container">
      <div id="loader" style="display:none;">Generando tu arte...</div>
      <img id="resultadoIA" src="" alt="" style="display:none;" />
    </div>

    <a href="../../index.html" class="btn-volver">← Volver al Menú</a>
  </div>

  <script>
    async function enviarPrompt() {
      const promptTexto = document.getElementById("promptInput").value;
      const btn = document.getElementById("btnGenerar");
      const loader = document.getElementById("loader");
      const imagenContenedor = document.getElementById("resultadoIA");

      if (!promptTexto.trim()) {
        alert("Por favor, escribe un prompt primero.");
        return;
      }

      btn.disabled = true;
      loader.style.display = "block";
      imagenContenedor.style.display = "none";

      try {
        const respuesta = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptTexto })
        });

        const datos = await respuesta.json();

        if (datos.image) {
          imagenContenedor.src = datos.image;
          imagenContenedor.style.display = "block";
        } else {
          alert("Error: " + (datos.error || "No se pudo generar"));
        }
      } catch (error) {
        console.error("Error de conexión:", error);
        alert("Hubo un error al conectar con el servidor.");
      } finally {
        btn.disabled = false;
        loader.style.display = "none";
      }
    }
  </script>
</body>
</html>
