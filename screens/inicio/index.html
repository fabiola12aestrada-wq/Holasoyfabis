<script>
    // El botón "Crear nuevo" del encabezado también lleva al generador
    document.getElementById('btnCrearNuevo').addEventListener('click', function () {
      window.location.href = '../generador/index.html';
    });

  <script type="module">
    // ---- Progreso real del Storyboard (misma tabla "scenes" que usan Storyboard/Renderizado) ----
    const seccion = document.getElementById('enProcesoSection');
    const contenido = document.getElementById('enProcesoContenido');
    const titulo = document.getElementById('enProcesoTitulo');

    function mostrarTarjeta(html) {
      seccion.classList.remove('hidden');
      contenido.innerHTML = html;
    }

    async function cargarProgreso() {
      try {
        const cfgRes = await fetch('/api/config');
        const cfg = await cfgRes.json();
        if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) return;

        const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
        const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

        const { data, error } = await supabase.from('scenes').select('*').order('position', { ascending: true });
        if (error || !data || data.length === 0) return; // sin escenas todavía: no mostramos la sección

        const total = data.length;
        const hechas = data.filter(function (s) { return !!s.image_url; }).length;
        const porcentaje = Math.round((hechas / total) * 100);

        if (hechas < total) {
          titulo.textContent = 'En Proceso';
          mostrarTarjeta(
            '<a href="../renderizado/index.html" class="glass-card rounded-xl p-stack-md flex items-center gap-stack-md group hover:border-primary/50 transition-colors no-underline">' +
              '<div class="relative w-16 h-16 flex items-center justify-center flex-shrink-0">' +
                '<span class="font-headline-md text-body-lg text-secondary-container">' + porcentaje + '%</span>' +
              '</div>' +
              '<div class="flex flex-col gap-1">' +
                '<span class="text-label-caps font-label-caps text-secondary-container">ENSAMBLANDO STORYBOARD...</span>' +
                '<h3 class="font-headline-md text-body-lg">' + hechas + ' de ' + total + ' escenas generadas</h3>' +
                '<div class="w-40 h-1 bg-white/10 rounded-full mt-1 overflow-hidden">' +
                  '<div class="h-full bg-secondary-container rounded-full" style="width:' + porcentaje + '%"></div>' +
                '</div>' +
              '</div>' +
            '</a>'
          );
        } else {
          titulo.textContent = 'Listo';
          mostrarTarjeta(
            '<a href="../renderizado/index.html" class="glass-card rounded-xl p-stack-md flex items-center gap-stack-md group hover:border-primary/50 transition-colors no-underline">' +
              '<div class="w-16 h-16 rounded-full bg-secondary-container/20 flex items-center justify-center flex-shrink-0">' +
                '<span class="material-symbols-outlined text-secondary-container">check_circle</span>' +
              '</div>' +
              '<div class="flex flex-col gap-1">' +
                '<span class="text-label-caps font-label-caps text-secondary-container">STORYBOARD COMPLETO</span>' +
                '<h3 class="font-headline-md text-body-lg">' + total + ' de ' + total + ' escenas listas — ver video</h3>' +
              '</div>' +
            '</a>'
          );
        }
      } catch (e) {
        // si algo falla, simplemente no mostramos la sección (sin romper el dashboard)
      }
    }

    cargarProgreso();

    // ---- Recientes reales: Generador (tabla generated_images) y Storyboard (tabla scenes) ----
    function tarjetaItem(imgUrl, titulo, subtitulo, href) {
      return (
        '<a href="' + href + '" class="flex flex-col gap-stack-sm cursor-pointer group no-underline">' +
          '<div class="relative aspect-[3/4] rounded-xl overflow-hidden glass-card border-none group-hover:bloom-purple transition-all duration-300">' +
            '<img class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" src="' + imgUrl + '"/>' +
          '</div>' +
          '<div class="px-1">' +
            '<h4 class="font-headline-md text-body-sm truncate">' + titulo + '</h4>' +
            '<p class="text-on-surface-variant text-[12px] font-body-sm">' + subtitulo + '</p>' +
          '</div>' +
        '</a>'
      );
    }

    function tiempoRelativo(fechaISO) {
      if (!fechaISO) return '';
      var diffMs = Date.now() - new Date(fechaISO).getTime();
      var horas = Math.floor(diffMs / 3600000);
      if (horas < 1) return 'Hace un momento';
      if (horas < 24) return 'Hace ' + horas + (horas === 1 ? ' hora' : ' horas');
      var dias = Math.floor(horas / 24);
      if (dias === 1) return 'Ayer';
      return 'Hace ' + dias + ' días';
    }

    async function cargarRecientes() {
      try {
        const cfgRes = await fetch('/api/config');
        const cfg = await cfgRes.json();
        if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) return;

        const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
        const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

        // --- Generador ---
        const genRes = await supabase
          .from('generated_images')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(4);

        if (!genRes.error && genRes.data && genRes.data.length > 0) {
          const grid = document.getElementById('recientesGeneradorGrid');
          grid.innerHTML = genRes.data.map(function (item) {
            return tarjetaItem(
              item.image_url,
              item.prompt ? item.prompt.slice(0, 40) : 'Imagen generada',
              tiempoRelativo(item.created_at),
              '../generador/index.html'
            );
          }).join('');
          document.getElementById('recientesGeneradorSection').classList.remove('hidden');
        }

        // --- Storyboard (solo escenas ya generadas) ---
        const escRes = await supabase
          .from('scenes')
          .select('*')
          .order('position', { ascending: true });

        if (!escRes.error && escRes.data) {
          const generadas = escRes.data.filter(function (s) { return !!s.image_url; }).slice(-4).reverse();
          if (generadas.length > 0) {
            const grid = document.getElementById('recientesStoryboardGrid');
            grid.innerHTML = generadas.map(function (s) {
              return tarjetaItem(
                s.image_url,
                s.label || 'Escena',
                'Storyboard',
                '../renderizado/index.html'
              );
            }).join('');
            document.getElementById('recientesStoryboardSection').classList.remove('hidden');
          }
        }
      } catch (e) {
        // si falla, simplemente no mostramos recientes (sin romper el dashboard)
      }
    }

    cargarRecientes();
  </script>
