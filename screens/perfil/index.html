<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil — FLUX_AI</title>
  <style>
    :root {
      --bg: #131314;
      --surface-elevated: #201f20;
      --border: #353436;
      --primary: #bc13fe;
      --primary-glow: #ebb2ff;
      --text: #e5e2e3;
      --cyan: #00f4fe;
      --error: #ffb4ab;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 2rem 1rem;
    }
    .container { width: 100%; max-width: 420px; }
    .avatar {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 700; color: #fff;
      margin: 0 auto 1rem;
    }
    h1 { text-align: center; font-size: 1.3rem; margin-bottom: 0.25rem; }
    .subtitle { text-align: center; opacity: 0.6; font-size: 0.85rem; margin-bottom: 2rem; }

    .stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
    }
    .stat-card .number { font-size: 1.8rem; font-weight: 700; color: var(--primary-glow); }
    .stat-card .label { font-size: 0.75rem; opacity: 0.7; margin-top: 0.25rem; }

    .recientes h2 { font-size: 1rem; margin-bottom: 0.75rem; opacity: 0.85; }
    .item-reciente {
      display: flex; align-items: center; gap: 0.75rem;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.6rem;
      margin-bottom: 0.6rem;
    }
    .item-reciente img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }
    .item-reciente p { font-size: 0.8rem; opacity: 0.85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #estado { text-align: center; opacity: 0.6; font-size: 0.9rem; margin-top: 1rem; }

    .btn-logout {
      display: block;
      width: 100%;
      margin-top: 2rem;
      padding: 0.75rem;
      background: transparent;
      border: 1px solid var(--error);
      color: var(--error);
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .btn-logout:hover { background: var(--error); color: var(--bg); }
    .btn-logout:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-volver {
      display: block; text-align: center; margin-top: 1rem; color: var(--text);
      text-decoration: none; font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="avatar">F</div>
    <h1>Faby</h1>
    <p class="subtitle">Creadora en FLUX_AI</p>

    <div class="stats">
      <div class="stat-card">
        <div class="number" id="total-imagenes">–</div>
        <div class="label">Imágenes generadas</div>
      </div>
      <div class="stat-card">
        <div class="number" id="dias-activa">–</div>
        <div class="label">Días desde el inicio</div>
      </div>
    </div>

    <div class="recientes">
      <h2>Actividad reciente</h2>
      <div id="lista-recientes"></div>
      <p id="estado"></p>
    </div>

    <button id="btn-logout" class="btn-logout">Cerrar sesión</button>
    <a href="../../index.html" class="btn-volver">← Volver al Menú</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const estado = document.getElementById("estado");

    try {
      const SUPABASE_URL = "https://ddyqisycapjtziiqytji.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_vP5c7xHOl4MwIHRCTkFC0w_DOut5s96";

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      async function cargarPerfil() {
        // Total de imágenes generadas
        const { count, error: countError } = await supabase
          .from("generated_images")
          .select("*", { count: "exact", head: true });

        if (countError) {
          estado.textContent = "Error al cargar estadísticas: " + countError.message;
          return;
        }

        document.getElementById("total-imagenes").textContent = count ?? 0;

        // Últimas 5 imágenes generadas
        const { data, error } = await supabase
          .from("generated_images")
          .select("*")
          .order("created_at", { ascending: false })
          .limit(5);

        if (error) {
          estado.textContent = "Error al cargar actividad: " + error.message;
          return;
        }

        if (!data || data.length === 0) {
          estado.textContent = "Aún no hay actividad.";
          document.getElementById("dias-activa").textContent = "0";
          return;
        }

        // Días desde la primera imagen generada
        const primera = data[data.length - 1];
        const { data: primerRegistro } = await supabase
          .from("generated_images")
          .select("created_at")
          .order("created_at", { ascending: true })
          .limit(1)
          .single();

        if (primerRegistro) {
          const dias = Math.max(1, Math.ceil((Date.now() - new Date(primerRegistro.created_at)) / (1000 * 60 * 60 * 24)));
          document.getElementById("dias-activa").textContent = dias;
        }

        const lista = document.getElementById("lista-recientes");
        data.forEach(item => {
          const div = document.createElement("div");
          div.className = "item-reciente";
          div.innerHTML = `<img src="${item.image_url}" alt="" /><p>${item.prompt}</p>`;
          lista.appendChild(div);
        });
      }

      cargarPerfil();

      // Cerrar sesión
      const btnLogout = document.getElementById("btn-logout");
      btnLogout.addEventListener("click", async () => {
        btnLogout.disabled = true;
        btnLogout.textContent = "Cerrando sesión...";

        const { error } = await supabase.auth.signOut();

        if (error) {
          estado.textContent = "Error al cerrar sesión: " + error.message;
          btnLogout.disabled = false;
          btnLogout.textContent = "Cerrar sesión";
          return;
        }

        // Redirige al menú/inicio (ajustá la ruta si tenés una pantalla de login separada)
        window.location.href = "../../index.html";
      });
    } catch (err) {
      estado.textContent = "Error al iniciar: " + err.message;
    }
  </script>
</body>
</html>
