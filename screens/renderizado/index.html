<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inicio — FLUX_AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
  <style>
    :root {
      --bg: #131314;
      --surface: #1c1b1c;
      --surface-elevated: #201f20;
      --border: #353436;
      --primary: #bc13fe;
      --primary-glow: #ebb2ff;
      --text: #e5e2e3;
      --text-dim: #d4c0d7;
      --cyan: #00f4fe;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 800px;
      margin: 0 auto 2rem auto;
    }
    .back-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-dim);
      text-decoration: none;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-elevated);
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      border-color: var(--primary);
      color: #fff;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      color: var(--primary-glow);
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    p { color: var(--text-dim); line-height: 1.6; }
  </style>
</head>
<body>
  <header>
    <a href="../../index.html" class="back-btn">
      <span class="material-icons">arrow_back</span>
      <span>Volver al menú</span>
    </a>
    <span style="font-family:'Space Grotesk'; font-weight:700; color:var(--primary);">FLUX_AI</span>
  </header>
  <main class="container">
    <h1>🏠 Pantalla de Inicio</h1>
    <p>Bienvenido a la plataforma. Aquí puedes consultar las novedades, tutoriales de uso y los últimos proyectos creados.</p>
  </main>
</body>
</html>
