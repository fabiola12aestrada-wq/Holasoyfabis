<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const SUPABASE_URL = "https://ddyqisycapjtziiqytji.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_vP5c7xHOl4MwIHRCTkFC0w_DOut5s96";

  let sbClient = null;
  try {
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    console.error("No se pudo inicializar Supabase:", e);
  }

  const grid = document.getElementById("assets-grid");
  const estado = document.getElementById("estado-assets");
  const searchInput = document.getElementById("search-input");
  const filterTabs = document.querySelectorAll(".filter-tab");

  let allAssets = [];
  let currentFilter = "all";

  function formatFecha(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleDateString();
  }

  function renderCard(asset) {
    const badgeClass = asset.source === "generador" ? "generador" : "storyboard";
    const badgeText = asset.source === "generador" ? "Generador" : "Storyboard";
    return (
      '<div class="glass-card rounded-2xl overflow-hidden flex flex-col group relative">' +
        '<span class="source-badge ' + badgeClass + '">' + badgeText + '</span>' +
        '<div class="aspect-square relative overflow-hidden">' +
          '<img class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" src="' + asset.imageUrl + '" alt="' + (asset.prompt || "").replace(/"/g, "&quot;") + '"/>' +
        '</div>' +
        '<div class="p-3">' +
          '<p class="text-body-sm font-medium truncate mb-1">' + (asset.label || asset.prompt || "Sin título") + '</p>' +
          '<p class="text-[10px] text-white/40 uppercase tracking-tighter">' + formatFecha(asset.createdAt) + '</p>' +
        '</div>' +
      '</div>'
    );
  }

  function renderGrid() {
    const query = (searchInput.value || "").trim().toLowerCase();

    const filtered = allAssets.filter(function (a) {
      const matchesFilter = currentFilter === "all" || a.source === currentFilter;
      const text = ((a.label || "") + " " + (a.prompt || "")).toLowerCase();
      const matchesSearch = !query || text.includes(query);
      return matchesFilter && matchesSearch;
    });

    if (filtered.length === 0) {
      grid.innerHTML = "";
      estado.textContent = allAssets.length === 0
        ? "Todavía no generaste ninguna imagen. Andá al Generador o al Storyboard para crear tu primera."
        : "No hay resultados para este filtro/búsqueda.";
      estado.className = "";
      return;
    }

    estado.textContent = "";
    grid.innerHTML = filtered.map(renderCard).join("");
  }

  filterTabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      filterTabs.forEach(function (t) {
        t.classList.remove("border-[#BC13FE]", "text-[#BC13FE]", "bg-[#BC13FE]/10", "bloom-active");
        t.classList.add("border-white/10", "text-white/40");
      });
      tab.classList.remove("border-white/10", "text-white/40");
      tab.classList.add("border-[#BC13FE]", "text-[#BC13FE]", "bg-[#BC13FE]/10", "bloom-active");
      currentFilter = tab.getAttribute("data-filter");
      renderGrid();
    });
  });

  searchInput.addEventListener("input", renderGrid);

  async function cargarAssets() {
    if (!sbClient) {
      estado.textContent = "No se pudo conectar con el servicio.";
      estado.className = "error";
      return;
    }

    try {
      const { data: { user } } = await sbClient.auth.getUser();

      // --- Imágenes del Generador simple (solo del usuario logueado) ---
      let generadorItems = [];
      if (user) {
        const { data, error } = await sbClient
          .from("generated_images")
          .select("*")
          .eq("user_id", user.id)
          .order("created_at", { ascending: false });

        if (error) throw error;

        generadorItems = (data || []).map(function (row) {
          return {
            source: "generador",
            imageUrl: row.image_url,
            prompt: row.prompt,
            label: row.prompt,
            createdAt: row.created_at,
          };
        });
      }

      // --- Imágenes del Storyboard (todas las escenas con imagen ya generada) ---
      const { data: scenesData, error: scenesError } = await sbClient
        .from("scenes")
        .select("*")
        .not("image_url", "is", null)
        .order("updated_at", { ascending: false });

      if (scenesError) throw scenesError;

      const storyboardItems = (scenesData || []).map(function (row) {
        return {
          source: "storyboard",
          imageUrl: row.image_url,
          prompt: row.prompt,
          label: row.label,
          createdAt: row.updated_at,
        };
      });

      allAssets = generadorItems.concat(storyboardItems).sort(function (a, b) {
        return new Date(b.createdAt) - new Date(a.createdAt);
      });

      renderGrid();
    } catch (err) {
      estado.textContent = "Error al cargar tus assets: " + err.message;
      estado.className = "error";
    }
  }

  cargarAssets();
})();
</script>
